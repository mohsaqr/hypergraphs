# Runs the torch-backed tests with the backend installed, and fails when any
# of them skips: R-CMD-check.yaml does not install torch, so there the neural
# tests skip silently.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: neural

permissions: read-all

jobs:
  neural:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      OMP_THREAD_LIMIT: 2
      TORCH_INSTALL: 1
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://mohsaqr.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::torch
            any::testthat
            any::pkgload
            any::cograph
            any::igraph
            local::.

      - name: Install libtorch
        run: |
          if (!torch::torch_is_installed()) torch::install_torch()
          stopifnot("libtorch did not install" = torch::torch_is_installed())
        shell: Rscript {0}

      - name: Neural tests (no skips allowed)
        run: |
          files <- c("heterogeneous_hgat", "hypergraph_allset", "hypergraph_hnhn",
                     "hypergraph_hypergcn", "text_hypergat", "text_hypergat_fit",
                     "text_neural")
          paths <- file.path("tests", "testthat", sprintf("test-%s.R", files))
          pkgload::load_all(".")
          results <- lapply(paths, \(p) as.data.frame(
            testthat::test_file(p, reporter = "summary")))
          results <- do.call(rbind, results)
          print(results[, c("file", "test", "nb", "failed", "skipped", "error")])
          stopifnot(
            "a neural test failed" = !any(results$failed > 0 | results$error),
            "a neural test skipped although torch is installed" = !any(results$skipped)
          )
        shell: Rscript {0}
